site_name: 2023 MSU Cloud Computing Fellowship
theme: 
  name: material
  features:
    - navigation.tracking
  palette:
    primary: black
plugins:
  - search
markdown_extensions:
  - meta
  - attr_list
  - pymdownx.magiclink
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      preserve_tabs: true
  - pymdownx.highlight:
      use_pygments: true
      linenums_style: pymdownx-inline
  - pymdownx.inlinehilite
  - md_in_html
extra:
  generator: false